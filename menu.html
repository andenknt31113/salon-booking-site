  <meta property="og:description" content="ZER01 barber/lounge のメニューと料金一覧。メンズカット・縮毛矯正・白髪ぼかしの料金と所要時間。" />
  <meta property="og:url" content="https://andenknt31113.github.io/salon-booking-site/menu.html" />

</head>
<body data-page="menu">
  <div id="site-header"></div>

  <main>
    <div class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="パンくず">
          <a href="index.html">サロンTOP</a><span>&gt;</span><span>メニュー</span>
        </nav>
        <h1>メニュー</h1>
        <p>価格はすべて税込表示です。髪の長さ・毛量により追加料金をいただく場合がございます。</p>
        <!-- おすすめ14件・単品9件で、390pxのスマホだとページの高さが7500pxあります。
             単品だけ見たい方が、おすすめ14件を全部通り過ぎることになるので、
             先にどちらへでも行けるようにします。 -->
        <p class="page-jump">
          <a href="#recommended">おすすめメニュー</a>
          <a href="#single">単品メニュー</a>
        </p>
      </div>
    </div>

    <section class="section" id="recommended">
      <div class="container">
        <div class="section-head is-left">
          <!-- 割引ではなく組み合わせのコースなので「COUPON」とは書きません（index.html と同じ理由） -->
          <span class="section-label">RECOMMENDED</span>
          <h2 class="section-title">おすすめメニュー</h2>
        </div>
        <!-- 掲載のタグで絞り込みます。タグを持たないおすすめメニュー（シート由来）の
             ときは、pages.js がこの箱ごと隠します。 -->
        <div class="tabs" id="coupon-tabs" role="tablist" hidden></div>
        <div class="coupon-list" id="coupon-list"></div>
      </div>
    </section>

    <section class="section section-alt" id="single">
      <div class="container">
        <div class="section-head is-left">
          <span class="section-label">MENU</span>
          <h2 class="section-title">単品メニュー</h2>
        </div>
        <div class="tabs" id="menu-tabs" role="tablist"></div>
        <div id="menu-list"></div>
        <div class="notice" style="margin-top:24px;">
          <b>ご注意</b>
          <span>表示の所要時間は目安です。仕上がりのご希望や髪の状態により前後する場合がございます。あらかじめご了承ください。</span>
        </div>
        <p style="text-align:center;margin-top:28px;">
          <a class="btn btn-primary btn-lg" href="reserve.html">メニューを選んで予約する</a>
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
