name: Publish public site only

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'
      - 'tools/prepare-site.mjs'
      - 'test/prepare-site.mjs'
      - 'test/final-release-static.mjs'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - run: node --test test/prepare-site.mjs
      - run: node tools/prepare-site.mjs "$RUNNER_TEMP/public-site"
      - run: FINAL_RELEASE_ROOT="$RUNNER_TEMP/public-site" node --test test/final-release-static.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/public-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
