name: Publish public site only

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'
      - 'tools/prepare-site.mjs'
      - 'tools/public-content.mjs'
      - 'tools/publish-menus.mjs'
      - 'tools/commit-publication.mjs'
      - 'tools/sync-asset-versions.mjs'
      - 'test/asset-versions.mjs'
      - 'test/directions-layout.mjs'
      - 'test/reservation-link.mjs'
      - 'test/prepare-site.mjs'
      - 'test/publication-gate.mjs'
      - 'test/publication-write-safety.mjs'
      - 'test/admin-publication.mjs'
      - 'test/customer-pagination.mjs'
      - 'test/customer-roster-deferred.mjs'
      - 'test/admin-csv-safety.mjs'
      - 'test/commit-publication.mjs'
      - 'test/publication-workflow.mjs'
      - 'test/publish-menus.mjs'
      - 'test/publish-menu-redirect.mjs'
      - 'test/final-release-static.mjs'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/update-public-menus.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      verify_booking:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - run: node --test test/publication-gate.mjs test/publication-write-safety.mjs test/publish-menu-redirect.mjs test/admin-publication.mjs
      - run: node --test test/customer-pagination.mjs test/customer-roster-deferred.mjs
      - run: node --test test/admin-csv-safety.mjs
      - run: node --test test/commit-publication.mjs test/publication-workflow.mjs
      - run: node test/publish-menus.mjs
      - run: node tools/publish-menus.mjs --check-local
      - run: node --test test/asset-versions.mjs test/directions-layout.mjs test/reservation-link.mjs
      - run: node --test test/prepare-site.mjs
      - run: node tools/prepare-site.mjs "$RUNNER_TEMP/public-site"
      - run: FINAL_RELEASE_ROOT="$RUNNER_TEMP/public-site" node --test test/final-release-static.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/public-site
      - if: inputs.verify_booking == true
        run: node tools/publish-menus.mjs --check
      - run: node tools/commit-publication.mjs --check "$(git rev-parse HEAD)"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
