permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test test/verify-booking.mjs test/verify-ui.mjs test/hermetic-admin-contracts.mjs
      - run: node tools/verify-booking.mjs
      - run: node --test test/admin-brief-history.mjs test/admin-selected-history.mjs test/admin-read-snapshot.mjs test/booking-email-queue.mjs test/booking-email-snapshot.mjs test/gas-native-snapshot.mjs test/sheet-read-snapshot.mjs
      - run: node --test test/admin-startup-data.mjs test/admin-startup-portal.mjs test/admin-menu-deferred.mjs test/admin-editor-loading.mjs
      - run: node --test test/admin-refresh-schema.mjs test/admin-reservation-refresh.mjs test/admin-history-loading.mjs test/admin-customer-details-loading.mjs
      - run: node --test test/admin-notification-race.mjs test/admin-mail-status-index.mjs test/admin-notification-health.mjs test/final-admin-notifications.mjs test/booking-email-queue-ui.mjs
      - run: node --test test/customer-pagination.mjs test/customer-roster-deferred.mjs test/customer-profile.mjs
      - run: node --test test/admin-occupancy-intervals.mjs test/admin-closed-calendar-loading.mjs test/admin-calendar-loading.mjs
      - run: node --test test/measure-booking-backend.mjs test/read-probe-cli.mjs
      - run: node test/settings.mjs
