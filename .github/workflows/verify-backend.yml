name: Verify booking backend

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'test/admin-brief-history.mjs'
      - 'test/admin-selected-history.mjs'
      - 'test/admin-read-snapshot.mjs'
      - 'test/admin-menu-deferred.mjs'
      - 'test/admin-editor-loading.mjs'
      - 'test/admin-notification-race.mjs'
      - 'test/admin-notification-health.mjs'
      - 'test/final-admin-notifications.mjs'
      - 'test/booking-email-queue-ui.mjs'
      - 'test/admin-startup-data.mjs'
      - 'test/admin-startup-portal.mjs'
      - 'test/customer-pagination.mjs'
      - 'test/customer-roster-deferred.mjs'
      - 'test/customer-profile.mjs'
      - 'test/measure-booking-backend.mjs'
      - 'test/read-probe-cli.mjs'
      - 'tools/measure-booking-backend.mjs'
      - 'test/booking-email-queue.mjs'
      - 'test/gas-native-snapshot.mjs'
      - 'test/settings.mjs'
      - 'assets/js/data.js'
      - 'assets/js/admin-data.js'
      - 'assets/js/admin.js'
      - 'assets/js/admin-portal.js'
      - 'assets/js/admin-notifications.js'
      - '.github/workflows/verify-backend.yml'
  pull_request:
    paths:
      - 'gas/**'
      - 'test/admin-brief-history.mjs'
      - 'test/admin-selected-history.mjs'
      - 'test/admin-read-snapshot.mjs'
      - 'test/admin-menu-deferred.mjs'
      - 'test/admin-editor-loading.mjs'
      - 'test/admin-notification-race.mjs'
      - 'test/admin-notification-health.mjs'
      - 'test/final-admin-notifications.mjs'
      - 'test/booking-email-queue-ui.mjs'
      - 'test/admin-startup-data.mjs'
      - 'test/admin-startup-portal.mjs'
      - 'test/customer-pagination.mjs'
      - 'test/customer-roster-deferred.mjs'
      - 'test/customer-profile.mjs'
      - 'test/measure-booking-backend.mjs'
      - 'test/read-probe-cli.mjs'
      - 'tools/measure-booking-backend.mjs'
      - 'test/booking-email-queue.mjs'
      - 'test/gas-native-snapshot.mjs'
      - 'test/settings.mjs'
      - 'assets/js/data.js'
      - 'assets/js/admin-data.js'
      - 'assets/js/admin.js'
      - 'assets/js/admin-portal.js'
      - 'assets/js/admin-notifications.js'
      - '.github/workflows/verify-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test test/admin-brief-history.mjs test/admin-selected-history.mjs test/admin-read-snapshot.mjs test/booking-email-queue.mjs test/gas-native-snapshot.mjs
      - run: node --test test/admin-startup-data.mjs test/admin-startup-portal.mjs test/admin-menu-deferred.mjs test/admin-editor-loading.mjs
      - run: node --test test/admin-notification-race.mjs test/admin-notification-health.mjs test/final-admin-notifications.mjs test/booking-email-queue-ui.mjs
      - run: node --test test/customer-pagination.mjs test/customer-roster-deferred.mjs test/customer-profile.mjs
      - run: node --test test/measure-booking-backend.mjs test/read-probe-cli.mjs
      - run: node test/settings.mjs
